<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Local review interface for flood-news image references">
    <title>Flood imagery review</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">VLM flooding dataset</p>
        <h1>Image review</h1>
      </div>
      <div class="summary" id="summary" aria-live="polite">Loading catalog…</div>
    </header>

    <main>
      <section class="controls" aria-label="Image filters">
        <label>
          <span>Outlet</span>
          <select id="outlet"><option value="all">All outlets</option></select>
        </label>
        <button class="secondary" id="exportReviews" type="button">Export decisions</button>
      </section>

      <section class="result-bar">
        <p id="resultCount" aria-live="polite"></p>
        <div class="pagination" aria-label="Pagination">
          <button id="previousPage" type="button" aria-label="Previous page">←</button>
          <span id="pageStatus"></span>
          <button id="nextPage" type="button" aria-label="Next page">→</button>
        </div>
      </section>

      <section class="image-grid" id="imageGrid" aria-live="polite"></section>
      <section class="empty-state" id="emptyState" hidden>
        <h2>No images match these filters</h2>
        <p>Try widening the outlet, article, or review selection.</p>
      </section>
    </main>


    <script src="app.js"></script>
  </body>
</html>
